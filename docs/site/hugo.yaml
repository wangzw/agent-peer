baseURL: https://zhanwei.wang/agent-peer/
title: agent-peer
locale: en

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

params:
  navbar:
    displayTitle: true
    displayLogo: false
  search:
    enable: true
    type: flexsearch
  editURL:
    enable: true
    base: https://github.com/wangzw/agent-peer/edit/main/docs/site/content
  footer:
    displayCopyright: false
    displayPoweredBy: false
  theme:
    default: system
    displayToggle: true

languages:
  en:
    label: English
    locale: en
    contentDir: content/en
    weight: 1
    title: agent-peer
    params:
      description: Cross-host communication for agents.
    menus:
      main:
        - name: Documentation
          pageRef: /docs
          weight: 1
        - name: Search
          weight: 2
          params:
            type: search
        - name: Language
          weight: 3
          params:
            type: language-switch
        - name: GitHub
          weight: 4
          url: https://github.com/wangzw/agent-peer
          params:
            icon: github
  zh:
    label: 中文
    locale: zh-CN
    contentDir: content/zh
    weight: 2
    title: agent-peer
    params:
      description: agent 之间的跨主机通信。
    menus:
      main:
        - name: 文档
          pageRef: /docs
          weight: 1
        - name: 搜索
          weight: 2
          params:
            type: search
        - name: 语言
          weight: 3
          params:
            type: language-switch
        - name: GitHub
          weight: 4
          url: https://github.com/wangzw/agent-peer
          params:
            icon: github
