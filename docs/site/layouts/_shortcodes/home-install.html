{{- $label := .Get "label" | default "Copy install command" -}}
{{- $copied := .Get "copied" | default "Copied" -}}
<div class="home-install">
  <pre class="home-how-code"><code>curl -fsSL https://github.com/wangzw/agent-peer/releases/latest/download/install.sh | sh</code></pre>
  <button type="button" class="home-install-copy" aria-label="{{ $label }}" data-copied-label="{{ $copied }}">
    <svg class="home-install-copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M8 16H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2m-6 12h8a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2z"></path>
    </svg>
    <svg class="home-install-check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M5 13l4 4L19 7"></path>
    </svg>
    <span class="home-install-copy-status" role="status" aria-live="polite"></span>
  </button>
</div>
<script>
  (function () {
    document.querySelectorAll('.home-install').forEach(function (block) {
      var button = block.querySelector('.home-install-copy');
      var code = block.querySelector('.home-how-code code');
      if (!button || !code || button.hasAttribute('data-copy-ready')) {
        return;
      }
      button.setAttribute('data-copy-ready', 'true');
      var copiedLabel = button.getAttribute('data-copied-label') || 'Copied';
      var status = button.querySelector('.home-install-copy-status');
      var timer;
      button.addEventListener('click', function () {
        if (!navigator.clipboard || !navigator.clipboard.writeText) {
          return;
        }
        navigator.clipboard.writeText(code.textContent).then(function () {
          button.classList.add('copied');
          status.textContent = copiedLabel;
          clearTimeout(timer);
          timer = setTimeout(function () {
            button.classList.remove('copied');
            status.textContent = '';
          }, 1500);
        }).catch(function () {});
      });
    });
  })();
</script>
