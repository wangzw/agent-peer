version: 2

project_name: agent-peer

builds:
  - id: agent-peer
    main: ./cmd/agent-peer
    binary: agent-peer
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        - cmd: >-
            sh -c 'if grep -a -q AGENT_PEER_TEST_ "$0"; then echo "test hook string AGENT_PEER_TEST_ found in $0" >&2; exit 1; fi' "{{ .Path }}"

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - src: scripts/archive-README.md
        dst: README.md
      - src: scripts/install.sh
        dst: install.sh
        info:
          mode: 0755
      - third_party/claude-code-socket-transport/LICENSE
      - THIRD_PARTY_LICENSES/**/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

release:
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
