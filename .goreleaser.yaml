version: 2

project_name: peers

builds:
  - id: peers
    main: ./cmd/peers
    binary: peers
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        - cmd: >-
            sh -c 'if grep -a -q PEERS_TEST_ "$0"; then echo "test hook string PEERS_TEST_ found in $0" >&2; exit 1; fi' "{{ .Path }}"

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - src: scripts/archive-README.md
        dst: README.md
      - src: scripts/install.sh
        dst: install.sh
        info:
          mode: 0755
      - third_party/claude-code-socket-transport/LICENSE
      - THIRD_PARTY_LICENSES/**/*
      - man/*.1

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

release:
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
  extra_files:
    # Published at releases/latest/download/install.sh: the command users pipe
    # into sh. The source is scripts/remote-install.sh, the script that
    # downloads, verifies and runs the archive's own install.sh.
    - glob: scripts/remote-install.sh
      name_template: install.sh
