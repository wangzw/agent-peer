version: "2"

run:
  tests: true
  build-tags: [agentpeer_testenv]

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    generated: disable
    paths:
      - third_party
    rules:
      - path: \.pb\.go$
        linters:
          - govet
          - staticcheck

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party
