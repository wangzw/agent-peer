name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: lint, generate and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.75.0
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Put the installed tools on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run the build gates
        run: make lint proto-lint gen-check test JOBS=4

  macos:
    name: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - name: Run the tests
        run: make test JOBS=4

  macos-service:
    name: service end-to-end
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - name: Run the macOS service end-to-end tests
        run: make e2e-darwin
      - name: Clean up the installed services
        if: always()
        run: |
          uid="$(id -u)"
          launchctl bootout "gui/$uid/io.github.wangzw.agent-peer" 2>/dev/null || true
          sudo launchctl bootout "system/io.github.wangzw.agent-peer" 2>/dev/null || true
          sudo pkill -f 'agent-peer-test broker --system --listen :17446' 2>/dev/null || true
          rm -f "$HOME/Library/LaunchAgents/io.github.wangzw.agent-peer.plist"
          sudo rm -f "/Library/LaunchDaemons/io.github.wangzw.agent-peer.plist"
          sudo rm -f /usr/local/libexec/agent-peer-test
