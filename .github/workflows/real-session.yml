name: Real session probe

on:
  push:
    branches: ["probe/**"]

permissions:
  contents: read

concurrency:
  group: real-session
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      R: /tmp/agent-peer-rs
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - name: Select the probe
        run: |
          p="${GITHUB_REF_NAME#probe/}"
          case "$p" in
            selftest) ;;
            preflight) ;;
            binding) ;;
            registry) ;;
            ref-clear) ;;
            inbound) ;;
            signature) ;;
            reply) ;;
            mcp-toggle) ;;
            subagent) ;;
            headless) ;;
            broker-down) ;;
            permissions) ;;
            ratelimit) ;;
            *)
              echo "unknown probe: $p" >&2
              exit 1
              ;;
          esac
          echo "PROBE=$p" >> "$GITHUB_ENV"
      - name: Install tools
        timeout-minutes: 10
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 tmux strace stress-ng jq
      - name: Install Claude Code
        timeout-minutes: 10
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.311
          "$HOME/.local/bin/claude" --version
      - name: Build
        timeout-minutes: 15
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/build/agent-peer" ./cmd/agent-peer
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/build/rsprobe" ./test/realsession/rsprobe
      - name: Prepare
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "secret CLAUDE_CODE_OAUTH_TOKEN is missing" >&2
            exit 1
          fi
          "$RUNNER_TEMP/build/rsprobe" env init --root "$R" --claude-bin "$(readlink -f "$HOME/.local/bin/claude")" --agent-peer-bin "$RUNNER_TEMP/build/agent-peer"
          "$R/bin/rsprobe" env check --root "$R"
          "$R/run" claude mcp add --scope user peer -- "$R/bin/agent-peer" mcp
      - name: Run the probe
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash "test/realsession/probes/$PROBE.sh"
      - name: Count model calls
        if: always()
        run: '"$R/bin/rsprobe" env usage --root "$R" > "$R/out/$PROBE/usage.txt"'
      - name: Clean up
        if: always()
        run: '"$R/bin/rsprobe" env clean --root "$R"'
      - name: Scan the evidence for the token
        id: scan
        if: ${{ !cancelled() }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "secret CLAUDE_CODE_OAUTH_TOKEN is missing" >&2
            exit 1
          fi
          status=0
          grep -rqF -- "$CLAUDE_CODE_OAUTH_TOKEN" "$R/out" || status=$?
          if [ "$status" -eq 0 ]; then
            rm -rf "$R/out"
            echo "the evidence contains the token; removed it and skipped the upload" >&2
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "cannot scan the evidence: grep exited with status $status" >&2
            exit 1
          fi
      - name: Upload
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: probe-${{ env.PROBE }}
          path: /tmp/agent-peer-rs/out/${{ env.PROBE }}/
          if-no-files-found: error
          retention-days: 30
