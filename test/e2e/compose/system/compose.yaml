# Every service, network and volume carries the owner label below. The Go
# caller (syscontainer.newTestContainer) passes this process's marker as
# ape2e-<pid>-<start>-pidns<inode>, and harness.CleanResidue removes only
# resources whose owner is gone. A manual cleanup uses the same filter:
#   docker ps -a --filter label=peers.e2e.owner
services:
  plain:
    image: ${PEERS_E2E_SYSTEM_IMAGE:?}
    init: true
    user: root
    labels:
      peers.e2e.owner: ${PEERS_E2E_OWNER:?}
    # The no-egress check installs an OUTPUT DROP rule inside this container
    # when the internal network's gateway is reachable. Only this container's
    # netns is changed.
    cap_add: [NET_ADMIN, NET_RAW]
    entrypoint: []
    command: ["sleep", "infinity"]
    environment:
      PEERS_E2E_IN_CONTAINER: "1"
    volumes:
      - ${PEERS_E2E_BIN:?}:/opt/peers-test:ro
    networks:
      - system
  # The first host of a pair. The service keeps its historical name so Run and
  # every existing test start it unchanged; hostA is the network name the other
  # host dials.
  systemd:
    image: ${PEERS_E2E_SYSTEM_IMAGE:?}
    privileged: true
    cgroup: host
    labels:
      peers.e2e.owner: ${PEERS_E2E_OWNER:?}
    tmpfs:
      - /run
      - /run/lock
    environment:
      PEERS_E2E_IN_CONTAINER: "1"
    volumes:
      - ${PEERS_E2E_BIN:?}:/opt/peers-test:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # The two hosts of a pair exchange pairing files and completion markers
      # here. A named volume is mounted at the same path in both services.
      - pair-shared:/shared
    networks:
      system:
        aliases:
          - hostA
  # The second host of a pair. It is host A's equal: systemd as process 1 and
  # the extrausers accounts from the image, so either side can run a system or
  # user-level Broker. It is started only by syscontainer.RunPairTest.
  hostB:
    image: ${PEERS_E2E_SYSTEM_IMAGE:?}
    privileged: true
    cgroup: host
    labels:
      peers.e2e.owner: ${PEERS_E2E_OWNER:?}
    tmpfs:
      - /run
      - /run/lock
    environment:
      PEERS_E2E_IN_CONTAINER: "1"
    volumes:
      - ${PEERS_E2E_BIN:?}:/opt/peers-test:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - pair-shared:/shared
    networks:
      system:
        aliases:
          - hostB

volumes:
  pair-shared:
    labels:
      peers.e2e.owner: ${PEERS_E2E_OWNER:?}

networks:
  # Explicitly declared and internal so the containers have no way out. The
  # subnet lies in the high-end block of 198.18.0.0/15 that the harness routed
  # allocator reserves for these networks, so the two allocators never hand out
  # overlapping subnets. Docker therefore never picks an address from the host's
  # own networks for a bridge route.
  # syscontainer.Run overrides the subnet per compose project because Docker
  # refuses two live networks with overlapping subnets and system tests run in
  # parallel; the default is what a manual compose invocation uses.
  system:
    internal: true
    labels:
      peers.e2e.owner: ${PEERS_E2E_OWNER:?}
    ipam:
      config:
        - subnet: ${PEERS_E2E_SYSTEM_SUBNET:-198.19.240.0/24}
