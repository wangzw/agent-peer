# TopoPortForward: hostA behind the router on lana, hostB on the WAN.
# The router DNATs its own 17443 to hostA; hostA's lana address itself is not
# reachable from hostB because the router forwards only the DNATed connection.
services:
  hostA:
    image: ${E2E_IMAGE}
    hostname: ${HOSTA_NAME:-hostA}
    init: true
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ["${CTL_HOSTA}:/ctl"]
    networks: [lana]

  router:
    image: ${E2E_IMAGE}
    hostname: ${ROUTER_NAME:-router}
    init: true
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ["${CTL_ROUTER}:/ctl"]
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.forwarding: 1
    networks: [lana, wan]

  hostB:
    image: ${E2E_IMAGE}
    hostname: ${HOSTB_NAME:-hostB}
    init: true
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ["${CTL_HOSTB}:/ctl"]
    networks: [wan]

# See nat.yaml: routed gateway mode is what lets the router container forward
# between the networks on Docker 29, and the subnets are pinned inside
# 198.18.0.0/15 so a bridge route never captures this k8s node's own networks.
# The harness overrides them per project because concurrent copies of the
# topology cannot share a subnet.
networks:
  lana:
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: routed
    ipam:
      config:
        - subnet: ${PORTFWD_LANA_SUBNET:-198.18.3.0/24}
  wan:
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: routed
    ipam:
      config:
        - subnet: ${PORTFWD_WAN_SUBNET:-198.18.4.0/24}
