# TopoMITM: the services and networks of TopoNAT. The harness adds the
# REDIRECT rule on the router and starts the relay on the router's port 17443.
services:
  hostA:
    image: ${E2E_IMAGE}
    hostname: ${HOSTA_NAME:-hostA}
    init: true
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ["${CTL_HOSTA}:/ctl"]
    networks: [wan, wan2]

  router:
    image: ${E2E_IMAGE}
    hostname: ${ROUTER_NAME:-router}
    init: true
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ["${CTL_ROUTER}:/ctl"]
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.forwarding: 1
    networks: [wan, wan2, lanb]

  hostB:
    image: ${E2E_IMAGE}
    hostname: ${HOSTB_NAME:-hostB}
    init: true
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ["${CTL_HOSTB}:/ctl"]
    networks: [lanb]

# See nat.yaml: routed gateway mode is what lets the router container forward
# between the networks on Docker 29.
networks:
  wan:
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: routed
  wan2:
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: routed
  lanb:
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: routed
